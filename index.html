<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Best - Fashion Store</title>
    <link href="https://fonts.googleapis.com/css2?family=Raleway:wght@200;300&family=Purple+Purse&family=Prosto+One&family=Radio+Canada+Big&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header class="main-header">
        <div class="burger-menu">
            <div class="line-1"></div>
            <div class="line-2"></div>
            <div class="line-3"></div>
        </div>
        
        <nav class="top-nav">
            <a href="#">NEW</a>
            <a href="katalog.html">КАТАЛОГ</a>
        </nav>

        <div class="settings">
            <div class="lang">UK</div>
            <div class="currency">UAH</div>
        </div>

        <div class="user-icons">
            <a href="#" class="icon-btn search">
                <img src="https://cdn-icons-png.flaticon.com/256/64/64673.png" alt="Пошук">
            </a>
            <a href="#" class="icon-btn user">
                <img src="https://cdn-icons-png.flaticon.com/512/1077/1077063.png" alt="Кабінет">
            </a>
            <a href="#" class="icon-btn heart">
                <img src="https://cdn-icons-png.flaticon.com/512/1077/1077035.png" alt="Обране">
            </a>
            <a href="#" class="icon-btn cart">
                <img src="https://cdn-icons-png.flaticon.com/512/3081/3081986.png" alt="Кошик">
            </a>
        </div>
    </header>

    <main class="hero-section">
        <div class="image-bg img-left"></div>
        <div class="image-bg img-center"></div>
        <div class="image-bg img-right"></div>
        
        <h1 class="main-logo">BEST</h1>
        
        <div class="hero-content">
            <h2 class="hero-title">Нова колекція</h2>
            <div class="divider"></div>
            <a href="#" class="hero-link">ДИВИТИСЯ НОВИНКИ</a>
        </div>
    </main>

    <section class="categories-section">
        <h2 class="section-title">Категорії</h2>
        
        <div class="cat-wrapper">
            <div class="category-item item-kurky">
                <div class="cat-label">Куртки</div>
            </div>
            <div class="category-item item-palto">
                <div class="cat-label">Пальто</div>
            </div>
            <div class="category-item item-shuby">
                <div class="cat-label">Шуби</div>
            </div>
        </div>
    </section>

    <section class="subscribe-section">
        <h2 class="subscribe-title">Дізнайтеся першим про новинки</h2>
        <input type="email" class="subscribe-input" placeholder="Ваш e-mail*">
        <button class="subscribe-button">Підписатися</button>
    </section>

    <footer class="main-footer">
        <div class="footer-col">
            <h3>КОМПАНІЯ</h3>
            <p>Про нас</p>
            <p>Контакти</p>
        </div>
        <div class="footer-col">
            <h3>КОРИСНЕ</h3>
            <p>Оплата та доставка</p>
            <p>Умови повернення</p>
            <p>Бонусна система</p>
        </div>
        <div class="footer-col">
            <h3>ПОКУПЦЮ</h3>
            <p>Обране</p>
        </div>
        <div class="footer-col">
            <h3>КОНТАКТИ</h3>
            <p>+380 99 957 302 27</p>
        </div>
        <div class="copyright">©️ 2026 BEST. All rights reserved</div>
    </footer>

    <script src="script.js"></script>
</body>
</html>
